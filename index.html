<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Crush Proposal (But for Anything)</title>
  <meta name="description" content="A playful, interactive proposal page where the No button runs away and the Yes button becomes irresistible!">

  <!-- Google Fonts: Fredoka & Baloo 2 for playful, friendly typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Canvas for Ambient Floating Hearts/Sparkles -->
  <canvas id="ambientCanvas" aria-hidden="true"></canvas>

  <!-- Confetti Canvas for Victory Blast -->
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <!-- Corner Controls: Audio Mute & Dark/Light Mode -->
  <aside class="corner-controls" aria-label="Page controls">
    <button id="themeToggleBtn" class="icon-btn" title="Toggle color theme" aria-label="Toggle dark mode">
      <span id="themeIcon">🌙</span>
    </button>
    <button id="soundToggleBtn" class="icon-btn" title="Toggle sound effects" aria-label="Toggle sound">
      <span id="soundIcon">🔊</span>
    </button>
  </aside>

  
  <!-- Accessible Screen Reader Announcements -->
  <div id="srAnnounce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Main View Card -->
  <main class="page-wrapper">
    <div class="card" id="mainCard">

      
      <!-- Proposal Phase -->
      <section id="proposalView">
        <div id="recipientTag" class="recipient-tag" style="display: none;"></div>
        <div id="greetingContainer" class="greeting-text" style="display: none;"></div>
        
        <h1 id="questionHeadline" class="question-headline">
          Will you be my <span class="thing-highlight" id="thingWord">crush</span>?
        </h1>

        <div class="buttons-container" id="buttonsContainer">
          <button id="yesBtn" class="btn btn-yes" type="button">
            Yes
          </button>
          <button id="noBtn" class="btn btn-no" type="button">
            No
          </button>
        </div>

        
        <div id="counterHint" class="counter-hint" aria-hidden="true"></div>
      </section>

      
      <!-- Celebration Phase (Revealed on YES) -->
      <section id="celebrationView" class="celebration-view" aria-hidden="true">
        <div class="celebration-emoji" id="celebrationEmoji">💖</div>
        <h2 class="celebration-title" id="celebrationTitle">YAY!!! 💖</h2>
        <p class="celebration-subtitle" id="celebrationSubtitle">I knew you couldn't resist!</p>
        <button id="resetBtn" class="btn btn-reset" type="button">
          ✨ Do it again
        </button>
      </section>


    </div>
  </main>

  <!-- External Script Logic -->
  <script src="script.js"></script>
</body>
</html>
